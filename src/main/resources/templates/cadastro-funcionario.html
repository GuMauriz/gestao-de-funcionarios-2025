<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Novo Funcionário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout :: shell(~{::section})}">
  <section>
    <h2 class="h4 mb-3">Novo Funcionário</h2>

    <form th:action="@{/cadastro/funcionario}" th:object="${funcionario}" method="post" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nome</label>
        <input type="text" th:field="*{nome}" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">CPF</label>
        <input type="text" th:field="*{cpf}" class="form-control" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Cargo</label>
        <input type="text" th:field="*{cargo}" class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label">Departamento</label>
        <input type="text" th:field="*{departamento}" class="form-control">
      </div>

      <div class="col-md-6">
        <label class="form-label">Salário Base</label>
        <input type="number" step="0.01" th:field="*{salarioBase}" class="form-control">
      </div>

      <!-- Ponto agora (não pede hora; usa hora do sistema) -->
      <div class="col-12 form-check mt-2">
        <input class="form-check-input" type="checkbox" id="regEntrada" name="registrarEntrada">
        <label class="form-check-label" for="regEntrada">
          Registrar ponto de entrada agora
        </label>
      </div>

      <div class="col-12">
        <button type="submit" class="btn btn-dark">Salvar</button>
        <a href="/home" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </section>
</div>
</body>
</html>
