<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta charset="utf-8">
  <title>Novo Funcionário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h2>Novo Funcionário</h2>
  <form th:action="@{/cadastro/funcionario}" th:object="${funcionario}" method="post" class="mt-3">
    <div class="mb-2">
      <label>Nome</label>
      <input type="text" th:field="*{nome}" class="form-control" required>
    </div>
    <div class="mb-2">
      <label>CPF</label>
      <input type="text" th:field="*{cpf}" class="form-control" required>
    </div>
    <div class="mb-2">
      <label>Cargo</label>
      <input type="text" th:field="*{cargo}" class="form-control">
    </div>
    <div class="mb-2">
      <label>Salário Base</label>
      <input type="number" step="0.01" th:field="*{salarioBase}" class="form-control">
    </div>
    <button type="submit" class="btn btn-dark">Salvar</button>
    <a href="/home" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</body>
</html>
