<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Novo Terceirizado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout :: shell(~{::section})}">
  <section>
    <h2 class="h4 mb-3">Novo Terceirizado</h2>

    <form th:action="@{/cadastro/terceirizado}" th:object="${terceirizado}" method="post" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nome</label>
        <input type="text" th:field="*{nome}" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">CPF</label>
        <input type="text" th:field="*{cpf}" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Empresa Origem</label>
        <input type="text" th:field="*{empresaOrigem}" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Setor</label>
        <input type="text" th:field="*{setor}" class="form-control">
      </div>

      <!-- Registrar ENTRADA agora (hora do sistema), marcado por padrão -->
      <div class="col-12 form-check mt-2">
        <input class="form-check-input" type="checkbox" id="regEntradaT" name="registrarEntrada" checked>
        <label class="form-check-label" for="regEntradaT">
          Registrar entrada agora
        </label>
      </div>

      <div class="col-12">
        <button type="submit" class="btn btn-dark">Salvar</button>
        <a href="/home" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </section>
</div>
</body>
</html>
