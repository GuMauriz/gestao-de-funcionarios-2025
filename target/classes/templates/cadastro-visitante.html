<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Novo Visitante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h2>Novo Visitante</h2>
  <form th:action="@{/cadastro/visitante}" th:object="${visitante}" method="post" class="mt-3">
    <div class="mb-2">
      <label>Nome</label>
      <input type="text" th:field="*{nome}" class="form-control" required>
    </div>
    <div class="mb-2">
      <label>CPF</label>
      <input type="text" th:field="*{cpf}" class="form-control" required>
    </div>
    <div class="mb-2">
      <label>Empresa Origem</label>
      <input type="text" th:field="*{empresaOrigem}" class="form-control">
    </div>
    <div class="mb-2">
      <label>Motivo da Visita</label>
      <input type="text" th:field="*{motivoVisita}" class="form-control">
    </div>
    <button type="submit" class="btn btn-dark">Salvar</button>
    <a href="/home" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</body>
</html>
